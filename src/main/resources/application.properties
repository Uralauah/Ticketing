spring.application.name=Ticketing

spring.datasource.url= ${DATABASE_URL:jdbc:mysql://localhost:3306/ticketing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username= ${DATABASE_USER:ticket}
spring.datasource.password=${DATABASE_PASSWORD:ticket1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway(db/migration)에서 관리
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
#server.compression.enabled=true
#server.compression.mime-types=application/json
#server.compression.min-response-size=1024

spring.cache.type=redis