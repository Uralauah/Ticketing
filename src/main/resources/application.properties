spring.application.name=Ticketing

# ── DB ───────────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ticketing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USER:ticket}
spring.datasource.password=${DATABASE_PASSWORD:ticket1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway(db/migration)에서 관리
spring.jpa.hibernate.ddl-auto=validate
# 응답 작성 중 DB 커넥션 점유 방지
spring.jpa.open-in-view=false
# 예약이 몰릴 때 커넥션 대기 방지
spring.datasource.hikari.maximum-pool-size=30
# SQL 로그는 local 프로필에서만 출력

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── 대기열 (기본값: QueueProperties) ──────────────────────────────────────────
#ticketing.queue.max-active-users=2000
#ticketing.queue.promote-batch-size=200
#ticketing.queue.promote-interval=1s
#ticketing.queue.active-session-ttl=5m
#ticketing.queue.wait-token-ttl=24h
#ticketing.queue.wait-heartbeat-timeout=60s

# ── 운영 지표 ─────────────────────────────────────────────────────────────────
# 서비스 포트와 분리해 외부 노출 방지
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
