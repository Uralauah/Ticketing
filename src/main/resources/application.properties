spring.application.name=Ticketing

spring.datasource.url=jdbc:mysql://localhost:3306/ticketing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ticket
spring.datasource.password=ticket1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.data.redis.host=localhost
spring.data.redis.port=6379
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

spring.cache.type=redis